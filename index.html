<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QrStack Plataforma</title>
    <meta
      name="description"
      content="Plataforma QrStack para clientes, formulários, cardápios dinâmicos, Stories e insights."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css?v=qrstack-sync-20260807" />
  </head>
  <body>
    <div id="app" class="app-shell"></div>
    <script src="data/amaro-catalog.js?v=amaro-active-20260807"></script>
    <script src="script.js?v=qrstack-sync-20260807"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .getRegistrations()
            .then((registrations) => registrations.forEach((registration) => registration.unregister()))
            .catch(() => {});
          if ("caches" in window) {
            caches.keys().then((keys) => keys.forEach((key) => caches.delete(key))).catch(() => {});
          }
        });
      }
    </script>
  </body>
</html>
