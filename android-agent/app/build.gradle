plugins {
    id "com.android.application"
}

android {
    namespace "com.qrstack.agent"
    compileSdk 35

    defaultConfig {
        applicationId "com.qrstack.agent"
        minSdk 26
        targetSdk 35
        versionCode 19
        versionName "0.1.18"
        buildConfigField "String", "DEFAULT_API_URL", '"https://qrstack-api.qrstack.workers.dev"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.mlkit:text-recognition:16.0.1"
}
